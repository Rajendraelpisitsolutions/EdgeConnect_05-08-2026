<?xml version="1.0" encoding="UTF-8"?>
<!--
  Connectivity Studio favicon. Minimal "hub" glyph — three nodes
  converging into a central hub, suggesting the canonical-pipeline
  fan-in/fan-out semantics. Blue (#1976D2) matches the AppBar.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#1976D2"/>
  <circle cx="16" cy="16" r="4" fill="white"/>
  <circle cx="6"  cy="8"  r="2.5" fill="white"/>
  <circle cx="6"  cy="24" r="2.5" fill="white"/>
  <circle cx="26" cy="16" r="2.5" fill="white"/>
  <line x1="8.5"  y1="9"  x2="13" y2="14" stroke="white" stroke-width="1.5"/>
  <line x1="8.5"  y1="23" x2="13" y2="18" stroke="white" stroke-width="1.5"/>
  <line x1="20"   y1="16" x2="23.5" y2="16" stroke="white" stroke-width="1.5"/>
</svg>
