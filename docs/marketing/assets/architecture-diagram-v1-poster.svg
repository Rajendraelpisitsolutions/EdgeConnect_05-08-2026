<?xml version="1.0" encoding="UTF-8"?>
<!--
  File:        docs/marketing/assets/architecture-diagram-v1-poster.svg
  Purpose:     Multi-color poster variant for large-format print — trade-show
               banners, office wall displays, conference backdrops, partner
               event posters. Decorative-display use, NOT for technical
               documentation or in-flow marketing materials.
  Spec:        docs/marketing/architecture-diagram-spec-v2.md (master) + this
               poster variant is an authorized exception to spec §12 anti-
               pattern "no more than one accent color" — see notes below.
  Tokens:      docs/marketing/assets/brand/BRAND_TOKENS.md v1, with an inline
               poster-only override using all three logo colors (teal, orange,
               amber). The override does NOT propagate to other assets.
  Pair:        architecture-diagram-v1-dark.svg (master — substance)
  Version:     v1, poster variant
  Date:        2026-05-24
  Print sizing:
    The viewBox stays at 2400×1600 (same as master) so the SVG scales without
    rework. Recommended large-format renders:
      18×12 inch poster: 5400×3600 px @ 300 DPI
      24×16 inch poster: 7200×4800 px @ 300 DPI
      36×24 inch banner: 10800×7200 px @ 300 DPI
    SVG is resolution-independent — only the export DPI matters for print.
  Notes — EXCEPTION DOCUMENTATION:
    This variant DELIBERATELY breaks BRAND_TOKENS.md §2.5 and architecture-
    diagram-spec-v2.md §12 anti-pattern "no more than one accent color".
    Authorized because:
      1. User explicitly requested a multicolor poster on 2026-05-24.
      2. Poster context is decorative-display, not technical-documentation —
         a richer palette serves a different communicative purpose (visual
         identity at distance, brand cohesion with the logo's own multicolor).
      3. The multicolor palette uses ONLY the logo's authentic colors
         (sampled in BRAND_TOKENS §2.1): teal #00A0E0, orange #F08020,
         amber #F0B030. No new colors introduced.
      4. Layer-coded — colors carry semantic meaning (each layer of the
         platform has its own color), not arbitrary decoration.
    The teal-only discipline remains the default for all other assets.
    Future v2 of this poster may revisit the palette; v1 here is shipped
    as a one-off enrichment for print use.

  Layer color mapping (poster variant only):
    Factory floor   → teal   #00A0E0  (matches the wordmark/primary brand)
    Integration     → orange #F08020  (warm contrast — "the bridge")
    Intelligence    → amber  #F0B030  (golden — "insight, illumination")
    Consumers       → teal   #00A0E0  (echoes Factory — closes the loop)

  Token map (poster variant):
    bg.default        #1A1F26
    surface.hero      gradient #2A2F36 → #232830
    surface.secondary #3A4049
    text.body         #E8ECF1
    text.muted        #A8B3BD
    text.heading      #FFFFFF
    accent.factory    #00A0E0  ← teal (logo primary)
    accent.integration #F08020 ← orange (logo secondary)
    accent.intelligence #F0B030 ← amber (logo secondary)
    accent.consumers  #00A0E0  ← teal (logo primary, echoed)
    arrow.factory     #00A0E0
    arrow.integration #F08020
    arrow.intelligence #F0B030
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 2400 1600"
     width="2400" height="1600"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI Variable', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">

  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2A2F36"/>
      <stop offset="100%" stop-color="#232830"/>
    </linearGradient>

    <!-- Three layer-coded arrowheads (poster only) -->
    <marker id="arrowTeal" viewBox="0 0 16 16" refX="14" refY="8"
            markerWidth="16" markerHeight="16"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 16 8 L 0 16 Z" fill="#00A0E0"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 16 16" refX="14" refY="8"
            markerWidth="16" markerHeight="16"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 16 8 L 0 16 Z" fill="#F08020"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 16 16" refX="14" refY="8"
            markerWidth="16" markerHeight="16"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 16 8 L 0 16 Z" fill="#F0B030"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="2400" height="1600" fill="#1A1F26"/>

  <!-- Factory floor dashed boundary (teal — layer color) -->
  <rect x="140" y="140" width="580" height="1220" rx="10"
        fill="none" stroke="#00A0E0" stroke-width="1.5"
        stroke-dasharray="10 7" opacity="0.55"/>

  <!-- PER PLANT badge (teal accent) -->
  <g transform="translate(560 152)">
    <rect x="0" y="0" width="148" height="36" rx="18"
          fill="#2A2F36" stroke="#00A0E0" stroke-width="1.2"/>
    <text x="74" y="24" text-anchor="middle"
          font-size="16" font-weight="600"
          fill="#00A0E0" letter-spacing="0.14em">PER PLANT</text>
  </g>

  <!-- ============ Layer labels (each in layer color) ============ -->
  <g font-size="26" font-weight="600" letter-spacing="0.18em" text-anchor="middle">
    <text x="430"  y="178" fill="#00A0E0">FACTORY FLOOR</text>
    <text x="990"  y="178" fill="#F08020">INTEGRATION</text>
    <text x="1480" y="178" fill="#F0B030">INTELLIGENCE</text>
    <text x="2030" y="178" fill="#00A0E0">CONSUMERS</text>
  </g>

  <!-- ============ Column 1: Factory floor (teal accents) ============ -->

  <g id="controllers">
    <rect x="170" y="240" width="520" height="360" rx="8"
          fill="none" stroke="#00A0E0" stroke-width="1.5" opacity="0.85"/>
    <text x="430" y="290" text-anchor="middle"
          font-size="30" font-weight="600" fill="#E8ECF1">Controllers</text>

    <g transform="translate(220 330)">
      <g stroke="#00A0E0" stroke-width="1.6" fill="none">
        <rect x="0" y="6" width="36" height="24" rx="3"/>
        <line x1="6"  y1="14" x2="30" y2="14"/>
        <line x1="6"  y1="20" x2="22" y2="20"/>
        <line x1="6"  y1="26" x2="26" y2="26"/>
      </g>
      <text x="56" y="28" font-size="22" fill="#E8ECF1">CNCs</text>
    </g>
    <g transform="translate(220 376)">
      <g stroke="#00A0E0" stroke-width="1.6" fill="none">
        <rect x="0" y="2" width="36" height="32" rx="2"/>
      </g>
      <g fill="#00A0E0">
        <circle cx="8"  cy="11" r="2.2"/>
        <circle cx="18" cy="11" r="2.2"/>
        <circle cx="28" cy="11" r="2.2"/>
        <rect x="6"  y="20" width="24" height="2"/>
        <rect x="6"  y="26" width="16" height="2"/>
      </g>
      <text x="56" y="28" font-size="22" fill="#E8ECF1">Modbus PLCs</text>
    </g>
    <g transform="translate(220 422)">
      <g stroke="#00A0E0" stroke-width="1.6" fill="none">
        <circle cx="18" cy="20" r="15"/>
        <line x1="18" y1="20" x2="26" y2="11" stroke-linecap="round"/>
        <line x1="13" y1="32" x2="13" y2="33"/>
        <line x1="23" y1="32" x2="23" y2="33"/>
      </g>
      <text x="56" y="28" font-size="22" fill="#E8ECF1">Energy meters</text>
    </g>

    <line x1="200" y1="488" x2="660" y2="488"
          stroke="#00A0E0" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
    <text x="210" y="516" font-size="15" font-weight="600"
          fill="#00A0E0" letter-spacing="0.14em">PROTOCOLS</text>
    <text x="210" y="548" font-size="20" fill="#E8ECF1">FOCAS2 · MT-LINKi · MTConnect</text>
    <text x="210" y="578" font-size="20" fill="#E8ECF1">Brother HTTP · Modbus TCP</text>
  </g>

  <!-- Arrow 1: Controllers → EdgeConnect (teal — Factory layer) -->
  <line x1="430" y1="600" x2="430" y2="676"
        stroke="#00A0E0" stroke-width="2.5"
        marker-end="url(#arrowTeal)"/>

  <!-- EdgeConnect hero -->
  <g id="edgeconnect">
    <rect x="184" y="704" width="520" height="488" rx="10"
          fill="#262B32" stroke="#3A4049" stroke-width="1" opacity="0.55"/>
    <rect x="176" y="696" width="520" height="488" rx="10"
          fill="#272C33" stroke="#3A4049" stroke-width="1" opacity="0.85"/>
    <rect x="170" y="688" width="520" height="488" rx="10"
          fill="url(#heroGrad)" stroke="#00A0E0" stroke-width="1.5"/>

    <g transform="translate(610 720)" stroke="#00A0E0" stroke-width="2" fill="none">
      <rect x="0" y="0" width="48" height="36" rx="4"/>
      <circle cx="8"  cy="9" r="2.2" fill="#00A0E0" stroke="none"/>
      <circle cx="18" cy="9" r="2.2" fill="#00A0E0" stroke="none"/>
      <line x1="6"  y1="22" x2="42" y2="22"/>
      <line x1="6"  y1="29" x2="34" y2="29"/>
    </g>

    <text x="200" y="792" font-size="56" font-weight="700" fill="#FFFFFF">EdgeConnect</text>
    <text x="200" y="828" font-size="24" font-weight="400" fill="#A8B3BD">Edge runtime</text>
    <line x1="200" y1="870" x2="660" y2="870" stroke="#00A0E0" stroke-width="1" opacity="0.5"/>

    <g font-size="22" fill="#E8ECF1">
      <text x="200" y="912">Canonical data pipeline</text>
      <text x="200" y="948">Per-route store-and-forward</text>
      <text x="200" y="984">Three-way diagnostics</text>
      <text x="200" y="1020">Signed offline licensing</text>
    </g>

    <text x="200" y="1098" font-size="16" font-weight="600"
          fill="#00A0E0" letter-spacing="0.14em">DEPLOYS PER PLANT — ONE PER SITE</text>
    <text x="660" y="1140" text-anchor="end"
          font-size="32" font-weight="700" fill="#00A0E0">× N</text>
  </g>

  <!-- ============ Column 2: Integration (orange accents) ============ -->

  <g id="mqtt">
    <rect x="800" y="300" width="380" height="320" rx="8"
          fill="#3A4049" stroke="#F08020" stroke-width="1.5"/>

    <g transform="translate(990 380)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#F08020" stroke-width="2"/>
      <circle cx="0" cy="0" r="6"  fill="#F08020"/>
      <g stroke="#F08020" stroke-width="1.6" opacity="0.65">
        <line x1="-14" y1="-10" x2="-34" y2="-22"/>
        <line x1="-14" y1="10"  x2="-34" y2="22"/>
        <line x1="14"  y1="-10" x2="34"  y2="-22"/>
        <line x1="14"  y1="10"  x2="34"  y2="22"/>
        <line x1="16"  y1="0"   x2="38"  y2="0"/>
      </g>
      <g fill="#F08020">
        <circle cx="-36" cy="-22" r="3"/>
        <circle cx="-36" cy="22"  r="3"/>
        <circle cx="36"  cy="-22" r="3"/>
        <circle cx="36"  cy="22"  r="3"/>
        <circle cx="40"  cy="0"   r="3"/>
      </g>
    </g>

    <text x="990" y="498" text-anchor="middle"
          font-size="34" font-weight="600" fill="#FFFFFF">MQTT broker</text>
    <text x="990" y="534" text-anchor="middle"
          font-size="20" fill="#A8B3BD">Pub/sub message bus</text>
    <text x="990" y="568" text-anchor="middle"
          font-size="18" fill="#A8B3BD">Any compliant broker</text>
  </g>

  <g id="opcua">
    <rect x="800" y="700" width="380" height="320" rx="8"
          fill="#3A4049" stroke="#F08020" stroke-width="1.5"/>

    <g transform="translate(972 776)" stroke="#F08020" stroke-width="2" fill="none">
      <rect x="0" y="0" width="48" height="56" rx="4"/>
      <line x1="0" y1="18" x2="48" y2="18"/>
      <line x1="0" y1="36" x2="48" y2="36"/>
    </g>
    <g transform="translate(972 776)" fill="#F08020">
      <circle cx="9"  cy="9"  r="2.2"/>
      <circle cx="9"  cy="27" r="2.2"/>
      <circle cx="9"  cy="45" r="2.2"/>
    </g>

    <text x="990" y="900" text-anchor="middle"
          font-size="34" font-weight="600" fill="#FFFFFF">OPC UA Server</text>
    <text x="990" y="936" text-anchor="middle"
          font-size="20" fill="#A8B3BD">Standard industrial endpoint</text>
    <text x="990" y="970" text-anchor="middle"
          font-size="18" fill="#A8B3BD">Read-only access</text>
  </g>

  <!-- ============ Column 3: Intelligence (amber accents) ============ -->

  <g id="eremos">
    <rect x="1280" y="340" width="400" height="680" rx="10"
          fill="url(#heroGrad)" stroke="#F0B030" stroke-width="1.5"/>

    <g transform="translate(1450 392)">
      <rect x="0" y="0" width="76" height="48" rx="4"
            fill="none" stroke="#F0B030" stroke-width="2"/>
      <line x1="0" y1="14" x2="76" y2="14"
            stroke="#F0B030" stroke-width="1.6"/>
      <g fill="#F0B030">
        <rect x="8"  y="32" width="8" height="10"/>
        <rect x="22" y="24" width="8" height="18"/>
        <rect x="36" y="28" width="8" height="14"/>
        <rect x="50" y="20" width="8" height="22"/>
        <rect x="64" y="26" width="8" height="16"/>
      </g>
      <g fill="#A8B3BD">
        <circle cx="6" cy="7" r="1.6"/>
        <circle cx="12" cy="7" r="1.6"/>
        <circle cx="18" cy="7" r="1.6"/>
      </g>
    </g>

    <text x="1480" y="502" text-anchor="middle"
          font-size="48" font-weight="700" fill="#FFFFFF">EREMOS V2</text>
    <text x="1480" y="540" text-anchor="middle"
          font-size="22" fill="#A8B3BD">Industrial intelligence</text>
    <line x1="1320" y1="594" x2="1640" y2="594"
          stroke="#F0B030" stroke-width="1" opacity="0.5"/>

    <g font-size="22" fill="#E8ECF1">
      <text x="1320" y="648">Multi-tenant analytics</text>
      <text x="1320" y="692">OEE via Segments</text>
      <text x="1320" y="736">Persistent alarms + incidents</text>
      <text x="1320" y="780">Configurable alerting</text>
      <text x="1320" y="824">Reports — PDF · Excel</text>
      <text x="1320" y="868">Tool-life · tag mapping</text>
    </g>

    <text x="1320" y="968" font-size="16" font-weight="600"
          fill="#F0B030" letter-spacing="0.14em">ONE TENANT — MANY PLANTS</text>
  </g>

  <!-- ============ Column 4: Consumers (teal accents — echoes Factory) ============ -->

  <g id="operations">
    <rect x="1780" y="300" width="500" height="240" rx="8"
          fill="none" stroke="#00A0E0" stroke-width="1.5" opacity="0.85"/>

    <g transform="translate(1820 340)">
      <g stroke="#00A0E0" stroke-width="1.6" fill="none">
        <circle cx="16" cy="12" r="9"/>
        <path d="M 2 36 Q 16 24 30 36"/>
        <rect x="44" y="6" width="46" height="32" rx="2"/>
      </g>
      <g stroke="#00A0E0" stroke-width="1.3" fill="none">
        <line x1="50" y1="14" x2="84" y2="14"/>
        <line x1="50" y1="22" x2="76" y2="22"/>
        <line x1="50" y1="30" x2="82" y2="30"/>
      </g>
    </g>

    <text x="1820" y="440" font-size="30" font-weight="600" fill="#E8ECF1">Operations team</text>
    <text x="1820" y="476" font-size="20" fill="#A8B3BD">Dashboards · Alerts</text>
    <text x="1820" y="508" font-size="20" fill="#A8B3BD">Shift reports · OEE views</text>
  </g>

  <g id="scada">
    <rect x="1780" y="600" width="500" height="240" rx="8"
          fill="none" stroke="#00A0E0" stroke-width="1.5" opacity="0.85"/>

    <g transform="translate(1820 640)" stroke="#00A0E0" stroke-width="1.6" fill="none">
      <rect x="0" y="0" width="60" height="38" rx="3"/>
      <rect x="6" y="6" width="48" height="26"/>
      <line x1="26" y1="42" x2="34" y2="42"/>
      <line x1="14" y1="50" x2="46" y2="50"/>
    </g>

    <text x="1820" y="740" font-size="30" font-weight="600" fill="#E8ECF1">SCADA · MES · HMI</text>
    <text x="1820" y="776" font-size="20" fill="#A8B3BD">OPC UA clients</text>
    <text x="1820" y="808" font-size="20" fill="#A8B3BD">Existing operational tools</text>
  </g>

  <g id="cloud">
    <rect x="1780" y="940" width="500" height="240" rx="8"
          fill="none" stroke="#00A0E0" stroke-width="1.5" opacity="0.85"/>

    <g transform="translate(1820 984)" stroke="#00A0E0" stroke-width="1.8" fill="none" stroke-linejoin="round">
      <path d="M 18 36 Q 0 36 0 22 Q 0 8 14 8 Q 18 -2 32 -2 Q 50 -2 52 14 Q 70 14 70 26 Q 70 38 54 38 L 18 38 Z"/>
    </g>

    <text x="1820" y="1082" font-size="30" font-weight="600" fill="#E8ECF1">Cloud platforms</text>
    <text x="1820" y="1118" font-size="20" fill="#A8B3BD">AWS · Azure · custom</text>
    <text x="1820" y="1150" font-size="20" fill="#A8B3BD">Filtered, aggregated egress</text>
  </g>

  <!-- ============ Flow arrows (colored by source layer) ============ -->

  <!-- Arrow 2: EdgeConnect → MQTT (teal — Factory source) -->
  <path d="M 690 808 L 760 808 L 760 460 L 794 460"
        fill="none" stroke="#00A0E0" stroke-width="2.5"
        marker-end="url(#arrowTeal)"/>

  <!-- Arrow 3: EdgeConnect → OPC UA Server (teal — Factory source) -->
  <path d="M 690 900 L 760 900 L 760 860 L 794 860"
        fill="none" stroke="#00A0E0" stroke-width="2.5"
        marker-end="url(#arrowTeal)"/>

  <!-- Arrow 4: MQTT broker → EREMOS V2 (orange — Integration source) -->
  <line x1="1180" y1="460" x2="1274" y2="460"
        stroke="#F08020" stroke-width="2.5"
        marker-end="url(#arrowOrange)"/>

  <!-- Arrow 5: EREMOS V2 → Operations team (amber — Intelligence source) -->
  <line x1="1680" y1="420" x2="1774" y2="420"
        stroke="#F0B030" stroke-width="2.5"
        marker-end="url(#arrowAmber)"/>

  <!-- ============ South bus (orange — Integration source) ============ -->

  <path d="M 1180 760 L 1220 760 L 1220 1060"
        fill="none" stroke="#F08020" stroke-width="2.5"/>
  <path d="M 1180 560 L 1240 560 L 1240 1060"
        fill="none" stroke="#F08020" stroke-width="2.5"/>
  <path d="M 1220 1060 L 1774 1060"
        fill="none" stroke="#F08020" stroke-width="2.5"
        marker-end="url(#arrowOrange)"/>
  <path d="M 1740 1060 L 1740 720 L 1774 720"
        fill="none" stroke="#F08020" stroke-width="2.5"
        marker-end="url(#arrowOrange)"/>
  <circle cx="1740" cy="1060" r="6" fill="#F08020"/>

  <!-- Caption -->
  <g id="caption" font-size="25" font-weight="400" font-style="italic"
     fill="#C8D0D8" text-anchor="middle">
    <text x="1200" y="1408">
      One EdgeConnect deploys at each plant. One EREMOS V2 tenant aggregates many sites.
    </text>
    <text x="1200" y="1444">
      Standard MQTT and OPC UA make the integration interoperable with whatever else you run.
    </text>
  </g>

</svg>
