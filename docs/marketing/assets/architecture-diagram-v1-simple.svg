<?xml version="1.0" encoding="UTF-8"?>
<!--
  File:        docs/marketing/assets/architecture-diagram-v1-simple.svg
  Purpose:     Simplified 3-box executive variant — the "elevator pitch"
               version. For executive contexts where the full diagram is too
               dense: investor decks, leave-behind one-pagers, conference
               banner strips, social-card composition.
  Spec:        docs/marketing/architecture-diagram-spec-v2.md §10 ("Simplified
               3-box variant")
  Tokens:      docs/marketing/assets/brand/BRAND_TOKENS.md v1
  Pair:        architecture-diagram-v1-dark.svg (full master — the substance)
  Version:     v1, simple variant
  Date:        2026-05-24
  Notes:
    - Canvas 1920×1080 (16:9 standard slide format).
    - Three boxes: Factory floor → Elpis Platform → Operations & Cloud.
      Middle box is the hero (gradient fill, larger title, teal accents).
    - Two arrows total. Both emphasized in teal — they trace the entire
      central data path of the platform, the same story the master tells
      with seven arrows but compressed.
    - Caption verbatim from spec §2.
    - Same palette, typography, stroke weights as the dark master.
    - No multi-site cue (the bottom hint inside Box 2 carries that meaning).
    - No protocol-label arrows (the box body text carries protocol names).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080"
     width="1920" height="1080"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI Variable', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">

  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2A2F36"/>
      <stop offset="100%" stop-color="#232830"/>
    </linearGradient>
    <marker id="arrowTeal" viewBox="0 0 16 16" refX="14" refY="8"
            markerWidth="16" markerHeight="16"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 16 8 L 0 16 Z" fill="#00A0E0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#1A1F26"/>

  <!-- Top label -->
  <text x="960" y="120" text-anchor="middle"
        font-size="22" font-weight="600" fill="#A8B3BD"
        letter-spacing="0.22em">ARCHITECTURE AT A GLANCE</text>

  <!-- ============ Box 1: Factory floor (tertiary, left) ============ -->
  <g id="factory">
    <rect x="190" y="220" width="440" height="600" rx="10"
          fill="none" stroke="#4A5560" stroke-width="1.5"/>

    <!-- Composite controllers icon row -->
    <g transform="translate(290 270)">
      <!-- CNC -->
      <g stroke="#A8B3BD" stroke-width="1.8" fill="none">
        <rect x="0"  y="8"  width="56" height="36" rx="4"/>
        <line x1="8"  y1="20" x2="48" y2="20"/>
        <line x1="8"  y1="28" x2="40" y2="28"/>
        <line x1="8"  y1="36" x2="46" y2="36"/>
      </g>
      <!-- PLC -->
      <g transform="translate(90 0)" stroke="#A8B3BD" stroke-width="1.8" fill="none">
        <rect x="0" y="2" width="56" height="48" rx="3"/>
      </g>
      <g transform="translate(90 0)" fill="#A8B3BD">
        <circle cx="12" cy="16" r="3"/>
        <circle cx="28" cy="16" r="3"/>
        <circle cx="44" cy="16" r="3"/>
        <rect x="10" y="28" width="36" height="3"/>
        <rect x="10" y="36" width="26" height="3"/>
      </g>
      <!-- Meter -->
      <g transform="translate(180 0)" stroke="#A8B3BD" stroke-width="1.8" fill="none">
        <circle cx="28" cy="28" r="22"/>
        <line x1="28" y1="28" x2="40" y2="14" stroke-linecap="round"/>
        <line x1="20" y1="46" x2="20" y2="48"/>
        <line x1="36" y1="46" x2="36" y2="48"/>
      </g>
    </g>

    <text x="410" y="408" text-anchor="middle"
          font-size="40" font-weight="600" fill="#E8ECF1">Factory floor</text>
    <text x="410" y="448" text-anchor="middle"
          font-size="22" fill="#A8B3BD">Per-plant equipment</text>

    <line x1="230" y1="498" x2="590" y2="498"
          stroke="#4A5560" stroke-width="1"/>

    <g font-size="22" fill="#E8ECF1" text-anchor="middle">
      <text x="410" y="552">CNCs · PLCs · Meters</text>
      <text x="410" y="592">FOCAS2 · MT-LINKi</text>
      <text x="410" y="632">MTConnect · Modbus TCP</text>
      <text x="410" y="672">Brother HTTP</text>
    </g>

    <text x="410" y="772" text-anchor="middle"
          font-size="16" font-weight="600"
          fill="#A8B3BD" letter-spacing="0.14em">MULTI-SITE FLEET</text>
  </g>

  <!-- Arrow 1: Factory → Elpis Platform (teal central path) -->
  <line x1="640" y1="520" x2="684" y2="520"
        stroke="#00A0E0" stroke-width="2.5"
        marker-end="url(#arrowTeal)"/>

  <!-- ============ Box 2: Elpis Platform (HERO, center) ============ -->
  <g id="platform">
    <rect x="690" y="200" width="540" height="640" rx="10"
          fill="url(#heroGrad)" stroke="#5E6B78" stroke-width="1.5"/>

    <!-- Composite hero icon: edge appliance + tiny connector + dashboard -->
    <g transform="translate(810 260)">
      <!-- Edge appliance -->
      <g stroke="#00A0E0" stroke-width="2" fill="none">
        <rect x="0" y="0" width="56" height="42" rx="4"/>
        <circle cx="10" cy="10" r="2.5" fill="#00A0E0" stroke="none"/>
        <circle cx="22" cy="10" r="2.5" fill="#00A0E0" stroke="none"/>
        <line x1="8" y1="24" x2="48" y2="24"/>
        <line x1="8" y1="32" x2="40" y2="32"/>
      </g>
      <!-- Connector -->
      <g fill="#00A0E0">
        <circle cx="72" cy="21" r="3"/>
        <circle cx="92" cy="21" r="3"/>
        <circle cx="112" cy="21" r="3"/>
      </g>
      <!-- Dashboard -->
      <g transform="translate(132 0)">
        <rect x="0" y="0" width="88" height="42" rx="4"
              fill="none" stroke="#00A0E0" stroke-width="2"/>
        <line x1="0" y1="12" x2="88" y2="12" stroke="#00A0E0" stroke-width="1.6"/>
        <g fill="#00A0E0">
          <rect x="8"  y="28" width="8" height="10"/>
          <rect x="24" y="20" width="8" height="18"/>
          <rect x="40" y="24" width="8" height="14"/>
          <rect x="56" y="16" width="8" height="22"/>
          <rect x="72" y="22" width="8" height="16"/>
        </g>
      </g>
    </g>

    <text x="960" y="408" text-anchor="middle"
          font-size="56" font-weight="700" fill="#FFFFFF">Elpis Platform</text>
    <text x="960" y="450" text-anchor="middle"
          font-size="24" fill="#A8B3BD">EdgeConnect + EREMOS V2</text>

    <line x1="740" y1="500" x2="1180" y2="500"
          stroke="#4A5560" stroke-width="1"/>

    <g font-size="22" fill="#E8ECF1" text-anchor="middle">
      <text x="960" y="554">Edge runtime per plant</text>
      <text x="960" y="594">Industrial intelligence — multi-tenant</text>
      <text x="960" y="634">Canonical pipeline · Store-and-forward</text>
      <text x="960" y="674">Signed offline licensing</text>
      <text x="960" y="714">Standard MQTT and OPC UA out</text>
    </g>

    <text x="960" y="792" text-anchor="middle"
          font-size="16" font-weight="600"
          fill="#A8B3BD" letter-spacing="0.14em">ONE TENANT — MANY PLANTS</text>
  </g>

  <!-- Arrow 2: Elpis Platform → Operations & Cloud (teal central path) -->
  <line x1="1240" y1="520" x2="1284" y2="520"
        stroke="#00A0E0" stroke-width="2.5"
        marker-end="url(#arrowTeal)"/>

  <!-- ============ Box 3: Operations & Cloud (tertiary, right) ============ -->
  <g id="consumers">
    <rect x="1290" y="220" width="440" height="600" rx="10"
          fill="none" stroke="#4A5560" stroke-width="1.5"/>

    <!-- Composite consumers icon row -->
    <g transform="translate(1390 270)">
      <!-- Person + screen -->
      <g stroke="#A8B3BD" stroke-width="1.8" fill="none">
        <circle cx="18" cy="14" r="10"/>
        <path d="M 2 42 Q 18 28 34 42"/>
      </g>
      <!-- Workstation -->
      <g transform="translate(50 0)" stroke="#A8B3BD" stroke-width="1.8" fill="none">
        <rect x="0" y="2" width="60" height="38" rx="3"/>
        <rect x="6" y="8" width="48" height="26"/>
        <line x1="26" y1="44" x2="34" y2="44"/>
        <line x1="14" y1="50" x2="46" y2="50"/>
      </g>
      <!-- Cloud -->
      <g transform="translate(140 4)" stroke="#A8B3BD" stroke-width="1.8" fill="none" stroke-linejoin="round">
        <path d="M 18 36 Q 0 36 0 22 Q 0 8 14 8 Q 18 -2 32 -2 Q 50 -2 52 14 Q 70 14 70 26 Q 70 38 54 38 L 18 38 Z"/>
      </g>
    </g>

    <text x="1510" y="408" text-anchor="middle"
          font-size="40" font-weight="600" fill="#E8ECF1">Operations &amp; Cloud</text>
    <text x="1510" y="448" text-anchor="middle"
          font-size="22" fill="#A8B3BD">Consumers</text>

    <line x1="1330" y1="498" x2="1690" y2="498"
          stroke="#4A5560" stroke-width="1"/>

    <g font-size="22" fill="#E8ECF1" text-anchor="middle">
      <text x="1510" y="552">Operations team — dashboards</text>
      <text x="1510" y="592">SCADA · MES · HMI</text>
      <text x="1510" y="632">AWS · Azure · custom</text>
      <text x="1510" y="672">Shift reports · alerts · OEE</text>
    </g>

    <text x="1510" y="772" text-anchor="middle"
          font-size="16" font-weight="600"
          fill="#A8B3BD" letter-spacing="0.14em">USE WHAT YOU ALREADY RUN</text>
  </g>

  <!-- Caption (verbatim per spec §2) -->
  <g id="caption" font-size="22" font-weight="400" font-style="italic"
     fill="#C8D0D8" text-anchor="middle">
    <text x="960" y="930">
      One EdgeConnect deploys at each plant. One EREMOS V2 tenant aggregates many sites.
    </text>
    <text x="960" y="962">
      Standard MQTT and OPC UA make the integration interoperable with whatever else you run.
    </text>
  </g>

</svg>
