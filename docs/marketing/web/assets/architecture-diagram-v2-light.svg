<?xml version="1.0" encoding="UTF-8"?>
<!--
  File:        docs/marketing/assets/architecture-diagram-v2-light.svg
  Purpose:     Master architecture diagram v2 — light variant.
               Paired with architecture-diagram-v2-dark.svg. Identical
               structure, dimensions, content. Only colors differ.
               Use on light-background contexts: white web pages,
               white-paper PDFs, light-themed email headers.
  Spec:        docs/marketing/architecture-diagram-spec-v3.md
  Tokens:      docs/marketing/assets/brand/BRAND_TOKENS.md v1 (§2.3 light palette)
  Pair:        architecture-diagram-v2-dark.svg (master dark variant)
  Version:     v2, light variant, rev3
  Date:        2026-05-25
  Notes:
    - Layout, dimensions, stroke weights, font sizes, content all
      byte-for-byte equivalent to the dark master. Any future structural
      change must land on both variants in the same commit.
    - Brand teal SHIFTS on light from #00A0E0 → #0080BC (darker teal,
      reaches 4.16:1 contrast on light bg, passing WCAG AA per
      BRAND_TOKENS §6).
    - Arrow stroke stays #5E6B78 (passes contrast on both dark + light).

  Token map (light variant):
    bg.light.default         #FAFBFC
    surface.light.hero       gradient #FFFFFF → #F4F7FB
    surface.light.secondary  #EEF1F5
    border.light.subtle      #D5DCE3
    border.light.strong      #A8B3BD
    text.body (light)        #1A1F26
    text.muted (light)       #5E6B78
    text.heading (light)     #0F1419
    brand.teal (light)       #0080BC   ← shifts darker from #00A0E0
    arrow.stroke             #5E6B78   ← unchanged
-->
<svg xmlns="http://www.w3.org/2000/svg"
