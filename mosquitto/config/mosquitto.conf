# ============================================================================
# Mosquitto MQTT Broker Configuration
# ============================================================================
# This file configures the Eclipse Mosquitto MQTT broker used by the
# Elpis EdgeConnect. Mosquitto acts as the central message bus:
#
#   CNC Bridge (publisher) → Mosquitto → SCADA / Dashboards / Historians (subscribers)
#
# CONFIGURATION RELOAD:
#   Mosquitto does NOT reload config on file change. You must restart:
#     $ docker-compose restart mqtt-broker
#
# SECURITY NOTES:
#   - ALWAYS use TLS (port 8883) in production
#   - ALWAYS enable authentication (allow_anonymous false)
#   - Disable the plaintext listener (port 1883) in production
#   - Regularly rotate TLS certificates and passwords
#   - Use ACLs (access control lists) to restrict topic access per user
#
# TESTING THE BROKER:
#   Subscribe to all CNC data:
#     $ mosquitto_sub -h localhost -p 1883 -t "factory/cnc/#" -v
#
#   Subscribe to bridge status:
#     $ mosquitto_sub -h localhost -p 1883 -t "factory/cnc/$bridge/status" -v
# ============================================================================


# ============================================================================
# LISTENERS — Define which ports and protocols the broker accepts
# ============================================================================

# ── TLS-encrypted MQTT listener (PRODUCTION — always use this) ──
# Port 8883 is the IANA-assigned port for MQTT over TLS.
# All data between the bridge and broker is encrypted.
listener 8883
# Protocol type: standard MQTT (not WebSocket)
protocol mqtt

# CA certificate file — used to verify client certificates (if mutual TLS is enabled).
# Also establishes the trust chain for the broker's own certificate.
# Format: PEM (.crt or .pem file)
cafile /mosquitto/certs/ca.crt

# Broker's TLS certificate — presented to connecting clients.
# Clients verify this certificate against the CA to confirm they're
# connecting to the real broker (not a man-in-the-middle).
certfile /mosquitto/certs/server.crt

# Broker's private key — paired with the certificate above.
# SECURITY: This file must be readable ONLY by the Mosquitto process.
# Never share or expose this file.
keyfile /mosquitto/certs/server.key

# Whether connecting clients MUST present a valid client certificate (mutual TLS).
#   false: Clients only need username/password auth (simpler setup)
#   true:  Clients must present a certificate signed by the CA (strongest security)
# Set to true for maximum security in production environments.
require_certificate false

# Minimum TLS version accepted by the broker.
# tlsv1.2 rejects connections using older, insecure TLS versions (1.0, 1.1).
# TLS 1.3 is also accepted when available (negotiated automatically).
tls_version tlsv1.2


# ── Plaintext MQTT listener (DEVELOPMENT ONLY) ──────────────────────
# Port 1883 is the standard MQTT port WITHOUT encryption.
#
# ┌─────────────────────────────────────────────────────────────────┐
# │ WARNING: DISABLE IN PRODUCTION!                                  │
# │ Passwords and machine data are transmitted in PLAIN TEXT.        │
# │ Anyone on the network can sniff credentials and data.            │
# │ Comment out or remove these two lines for production deployment. │
# └─────────────────────────────────────────────────────────────────┘
listener 1883
protocol mqtt


# ── WebSocket listener (optional — for browser-based dashboards) ──
# Port 9001 allows web browsers to connect using MQTT over WebSocket.
# JavaScript MQTT libraries (e.g., MQTT.js, Paho) can subscribe to
# CNC data topics and display real-time updates in web dashboards.
#
# NOTE: This is unencrypted WebSocket. For production, configure
# WSS (WebSocket Secure) with TLS certificates instead.
listener 9001
protocol websockets


# ============================================================================
# AUTHENTICATION — Who can connect to the broker
# ============================================================================

# Reject connections without valid credentials.
# When false (recommended), every client MUST provide a username and password.
# When true, anyone can connect (NEVER use in production).
allow_anonymous false

# Password file containing authorized usernames and their hashed passwords.
#
# CREATE THE PASSWORD FILE:
#   $ mosquitto_passwd -c /mosquitto/config/passwords.txt bridge_user
#   (prompts for password — enter the password for the bridge service)
#
# ADD MORE USERS:
#   $ mosquitto_passwd /mosquitto/config/passwords.txt dashboard_user
#   $ mosquitto_passwd /mosquitto/config/passwords.txt scada_user
#
# The passwords are stored as salted SHA-512 hashes (not plaintext).
# The bridge's MqttSettings.Username and MqttSettings.Password must match
# a user in this file.
password_file /mosquitto/config/passwords.txt

# ── Access Control Lists (ACL) — Optional ──
# Uncomment the line below to restrict which topics each user can access.
# This prevents dashboard users from publishing to machine data topics,
# and prevents the bridge from reading topics it doesn't need.
#
# Example ACL file (acl.txt):
#   # Bridge user can publish to all CNC topics
#   user bridge_user
#   topic write factory/cnc/#
#
#   # Dashboard user can only subscribe (read) CNC data
#   user dashboard_user
#   topic read factory/cnc/#
#
# acl_file /mosquitto/config/acl.txt


# ============================================================================
# PERSISTENCE — Survive broker restarts without losing messages
# ============================================================================

# Enable message persistence (save state to disk).
# When true, the broker saves:
#   - Retained messages (latest value per topic, e.g., bridge status)
#   - QoS 1/2 messages queued for disconnected clients with persistent sessions
#   - Client subscription information
# Without persistence, all of the above is lost when the broker restarts.
persistence true

# Directory where persistence files are stored.
# In Docker, this is mounted as a volume (./mosquitto/data) so data
# survives container restarts and rebuilds.
persistence_location /mosquitto/data/

# How often (in seconds) to flush in-memory data to the persistence file.
# Lower values = less data loss on crash, but more disk I/O.
# 60 seconds is a good balance for most deployments.
# Set to 0 to write on every message (high disk I/O, minimal data loss).
autosave_interval 60


# ============================================================================
# LOGGING — Diagnostics and troubleshooting
# ============================================================================

# Write logs to a file (in addition to stdout, which goes to Docker logs).
# In Docker, this path is inside the container. Mount ./mosquitto/log
# as a volume to access logs from the host.
log_dest file /mosquitto/log/mosquitto.log

# Log ALL event types. For production, you may want to reduce this to:
#   log_type error
#   log_type warning
#   log_type notice
# to reduce log volume. 'all' includes debug-level messages which
# can be very verbose (logs every CONNECT, SUBSCRIBE, PUBLISH, etc.).
log_type all

# Log connection and disconnection events (who connected/disconnected, when).
# Useful for diagnosing bridge reconnection issues or unauthorized access attempts.
connection_messages true


# ============================================================================
# PERFORMANCE — Tuning for CNC data throughput
# ============================================================================

# Maximum number of QoS 1/2 messages that can be in-flight (awaiting acknowledgment)
# per client at any time. Higher values improve throughput but use more memory.
#
# TUNING:
#   - 20 (default): Suitable for <10 machines
#   - 200: Good for the Fanuc bridge with 100+ machines publishing at 1Hz
#   - 1000: For very high throughput scenarios (500+ machines, sub-second polling)
max_inflight_messages 200

# Maximum number of QoS 1/2 messages queued per client when the client
# is disconnected (persistent session) or when in-flight limit is reached.
#
# If a subscriber disconnects temporarily, the broker queues up to this many
# messages. When the subscriber reconnects, queued messages are delivered.
#
# 10000 is generous — at 100 messages/sec, this holds ~100 seconds of data.
# Increase for subscribers that may be offline for extended periods.
max_queued_messages 10000

# Maximum MQTT message payload size in bytes.
# 1MB (1,048,576 bytes) is more than enough for CNC telemetry JSON payloads
# (which are typically 500-2000 bytes each).
#
# This limit prevents a misbehaving client from sending enormous messages
# that could exhaust broker memory.
message_size_limit 1048576
